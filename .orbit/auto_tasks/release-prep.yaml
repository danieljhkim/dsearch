schemaVersion: 1
name: release-prep
description: Guarded dsearch release-preparation probe
enabled: false
schedule:
  every_minutes: 180
template:
  title: Check whether the next dsearch release is ready to prepare
  description: |
    You are the release-preparation probe for this workspace. This is a
    report-first gate. It may read Orbit tasks, Git history, tags, and
    RELEASING.md. It may create or update one canonical release task only after
    the workspace is eligible. It must never edit repository files or release
    state during the gate.

    ## 1. Deterministic unfinished-work gate

    Query every task in `backlog`, `in-progress`, and `review` through the
    Orbit task surface. Sort the task IDs lexicographically before reporting
    them. Exempt a task only when its tags contain the exact provenance tag
    `auto-task:release-prep`; do not exempt tasks merely because they carry
    `release`, `release-prep`, or another `auto-task:<name>` tag.

    If any non-exempt task exists, persist the complete sorted blocking-ID list
    and the `unfinished_work` scenario in this probe's execution_summary, then
    stop successfully. Do not create or update a release task; change a task
    status; modify files or release metadata; commit; tag; push; publish; or
    seek human confirmation. A later scheduler slot must be able to rerun this
    exact gate.

    ## 2. Deterministic baseline and no-release gates

    Find the exclusive survey boundary with:

    ```sh
    git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1
    ```

    If no reachable `v*` tag exists, persist `no_baseline` and stop
    successfully without changing repository or release state. Otherwise,
    survey `<latest-tag>..HEAD` with the no-merge commands in RELEASING.md. If
    the range has no commits, persist the exact tag, `nothing_to_release`, and
    stop successfully without creating or updating a release task or changing
    repository or release state.

    ## 3. Eligible handoff

    When both gates pass, persist evidence in this probe's execution_summary:
    the sorted task query and empty blocker result; latest reachable tag;
    surveyed commit IDs and subjects; referenced DANI task IDs; candidate
    semver bump; and every breaking-change candidate with commit/task evidence.
    Derive the candidate from RELEASING.md and the effective Maven version.
    In the present `v0.2.0` to `1.0.0-SNAPSHOT` baseline mismatch, report
    `1.0.0` as a policy candidate; never silently inherit a pre-1.0 policy or
    classify a breaking change autonomously.

    Locate open tasks with both the exact `Prepare v<X.Y.Z> release` title
    pattern and the `release` tag. Select the lexicographically smallest ID if
    multiple matching tasks exist, report any duplicates, and create no second
    canonical task. If none exists, create exactly one backlog `chore` tagged
    `release`, whose description cites RELEASING.md, carries the candidate and
    survey evidence, and stops before all release actions. Its context_files
    must contain only the existing dsearch release modification targets:
    `file:CHANGELOG.md` and `file:pom.xml`. If a canonical task already exists,
    update only it with current evidence.

    Stop after the survey and canonical-task handoff. Do not edit files,
    CHANGELOG.md, or the Maven revision; commit; tag; push; publish; approve a
    task; or ask for or record human confirmation of a breaking-change
    classification.

    ## Deterministic validation scenarios

    - `unfinished_work`: report sorted non-exempt blockers and make no
      repository or release-state change.
    - `no_baseline` or `nothing_to_release`: report the missing or exact
      baseline tag and make no release change.
    - `eligible_handoff`: record the survey and candidate, then create or
      update exactly one canonical open `release` task.

    Repeated passes reuse the open release-prep probe through `skip_if_open`
    and reuse the selected canonical task rather than creating duplicates.
  acceptance_criteria:
  - The unfinished-work gate reports sorted blocking task IDs and exempts only tasks with the exact auto-task:release-prep provenance tag.
  - The no-baseline and nothing-to-release gates make no repository or release-state change and persist the scenario evidence.
  - An eligible pass records the latest reachable v* tag, no-merge survey, referenced task IDs, candidate semver bump, and evidence-backed breaking-change candidates.
  - An eligible pass creates or updates exactly one canonical Prepare v<X.Y.Z> release task tagged release, pointing to RELEASING.md and using only file:CHANGELOG.md and file:pom.xml as modification selectors.
  - The handoff stops before edits, commits, tags, pushes, publication, task approval, or human confirmation of breaking-change classification.
  - Repeated passes reuse both the open release-prep probe and the one canonical release task without duplicates.
  task_type: chore
  tags:
  - release-prep
  - no-diff-expected
  priority: high
  status: backlog
dedupe: skip_if_open
created_by: system
created_at: 2026-08-30T00:00:00Z
updated_by: system
